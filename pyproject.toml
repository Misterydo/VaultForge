[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultforge"
version = "0.1.0"
description = "Human Password Behavior Analysis Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "VaultForge Contributors"}]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
test = ["pytest>=8.0"]

[project.scripts]
vaultforge = "vaultforge.cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vaultforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
